name: Maester Daily Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "30 7 * * *"

permissions:
  id-token: write
  contents: read

jobs:
  maester:
    name: Run Maester checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify PowerShell compatibility
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.4') {
            throw 'Maester 3.0 requires PowerShell 7.4 or later.'
          }
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"

      - name: Run Maester tests
        id: maester
        uses: maester365/maester-action@main
        with:
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}
          include_public_tests: true
          include_private_tests: false
          include_exchange: false
          include_teams: false
          include_longrunning_tests: false
          include_preview_tests: false
          # Maester 3.0 is currently available through the preview channel.
          maester_version: preview
          disable_telemetry: false
          step_summary: true

      - name: Upload Maester report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maester-test-results
          path: |
            ./**/*.html
            ./**/*.json
          if-no-files-found: warn
